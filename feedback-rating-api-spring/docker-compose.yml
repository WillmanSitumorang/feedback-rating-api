version: "3.8"
services:
  postgres:
    image: postgres:14
    container_name: feedback-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: feedback_db
    ports:
      - "15432:15432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql